name: Mirror feature build diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Test and build diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test > test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo 'Mirror test failure. Exact output follows:' > comment.md
            tail -n 260 test.log >> comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
            exit $status
          fi
          npm run build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo 'Mirror build failure. Exact output follows:' > comment.md
            tail -n 220 build.log >> comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
            exit $status
          fi
